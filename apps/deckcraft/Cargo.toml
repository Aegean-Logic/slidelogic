[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft desktop app"
publish = false
default-run = "deckcraft"

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-media = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }
cpal = "0.16"
# Nextcloud (`nextcloud.rs`): HTTP with rustls, on worker threads, as WordLogic's and GridLogic's
# desktop apps. The system's own certificate store, so company and self-signed CAs it trusts work.
ureq = { version = "3", features = ["platform-verifier"] }
serde = { workspace = true }
# Nextcloud folder listings (WebDAV PROPFIND answers).
quick-xml = { workspace = true }

# The Nextcloud app password, in the system's own keychain.
[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "async-io", "crypto-rust"]

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
