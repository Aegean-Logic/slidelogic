<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SlideLogic app icon, "Banded slide": a wide slide with an ink header band and a sea trace
       forming an S that ends in the aqua node, with three slide dots below, on a marble tile.
       Sibling of GridLogic's "Sheet trace" and WordLogic's "W trace". Original work, built from
       the Aegean Logic palette: ink #0A2A3B, sea #12718C, aqua #2FC6C0, marble #F4F2EC.
       Used from 48 px up; deckcraft-small.svg is the simplified glyph for 32 px and below. -->
  <rect width="512" height="512" rx="112" fill="#F4F2EC"/>
  <!-- the slide and its header band -->
  <rect x="56" y="96" width="400" height="264" rx="28" fill="#FFFFFF"/>
  <path d="M56 124 A28 28 0 0 1 84 96 H428 A28 28 0 0 1 456 124 V152 H56 Z" fill="#0A2A3B"/>
  <rect x="56" y="96" width="400" height="264" rx="28" fill="none" stroke="#0A2A3B" stroke-width="16"/>
  <!-- the S trace and its node -->
  <path d="M288.4 203.1 A42.2 33.4 0 1 0 256 258 A47.5 37 0 1 1 219.6 318.7" fill="none" stroke="#12718C" stroke-width="30" stroke-linecap="round"/>
  <circle cx="288.4" cy="203.1" r="28" fill="#2FC6C0" stroke="#FFFFFF" stroke-width="12"/>
  <!-- slide dots, the current slide in ink -->
  <circle cx="212" cy="412" r="12" fill="#CED4D8"/>
  <circle cx="256" cy="412" r="12" fill="#0A2A3B"/>
  <circle cx="300" cy="412" r="12" fill="#CED4D8"/>
</svg>
